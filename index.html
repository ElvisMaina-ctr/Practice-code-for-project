
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="WeConnect is the community platform for Wecan Academy students and alumni."
    >

    <title>WeConnect | Member Login</title>

    <link rel="stylesheet" href="styles.css">
    <script src="J's main.js" defer></script>
</head>

<body>

    <header class="login-header">
        <a href="index.html" aria-label="WeConnect home">
            <h1>WeConnect</h1>
        </a>
        <p>Wecan Academy Community</p>
    </header>

    <main class="login-container">

        <section class="login-box" aria-labelledby="login-heading">

            <h2 id="login-heading">Welcome Back!</h2>

            <p class="subtitle">
                Sign in to connect with your community.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email

<section class="auth-section" aria-labelledby="auth-title">
  <div class="auth-card">
    <h1 id="auth-title">Welcome to WeConnect</h1>
    <p id="auth-description">Sign in to connect with the Wecan Academy community.</p>

    <!-- Sign In form: shown first -->
    <form id="sign-in-form">
      <h2>Sign In</h2>

      <label for="signin-email">Email address</label>
      <input type="email" id="signin-email" name="email" required>

      <label for="signin-password">Password</label>
      <input type="password" id="signin-password" name="password" required>

      <button type="submit">Sign In</button>

      <p>
        Don’t have an account?
        <button type="button" class="text-button" id="show-sign-up">
          Sign Up
        </button>
      </p>
    </form>

    <!-- Sign Up form: hidden until selected -->
    <form id="sign-up-form" hidden>
      <h2>Create Account</h2>

      <label for="signup-name">Full name</label>
      <input type="text" id="signup-name" name="name" required>

      <label for="signup-email">Email address</label>
      <input type="email" id="signup-email" name="email" required>

      <label for="signup-role">I am a</label>
      <select id="signup-role" name="role" required>
        <option value="">Choose your category</option>
        <option value="student">Student</option>
        <option value="alumni">Alumni</option>
        <option value="staff">Staff</option>
      </select>

      <label for="signup-password">Create password</label>
      <input type="password" id="signup-password" name="password" required>

      <button type="submit">Request Verification</button>

      <p>
        Already have an account?
        <button type="button" class="text-button" id="show-sign-in">
          Sign In
        </button>
      </p>
    </form>

    <!-- Demo verification message -->
    <div id="verification-message" class="verification-message" role="status" hidden>
      <h2>Verification Successful!</h2>
      <p>
        Demo only: your details have been submitted for membership verification.
        Real verification must be completed by WeConnect administrators.
      </p>
      <button type="button" id="back-to-sign-in">Go to Sign In</button>
    </div>
  </div>
</section>

 Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="show-password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <div class="form-options">

                    <label class="remember-me">
                        <input
                            type="checkbox"
                            name="remember"
                        >
                        Remember me
                    </label>

                    <a href="forgot-password.html">
                        Forgot password?
                    </a>

                </div>

                <p
                    id="message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button type="submit" class="login-button">
                    Log In
                </button>

            </form>

            <p class="register-link">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

        </section>

    </main>

    <footer class="login-footer">
        <p>
            &copy; 2026 WeConnect. Wecan Academy Community.
        </p>
    </footer>

</body>
</html>
