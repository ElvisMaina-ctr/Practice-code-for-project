
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="WeConnect is the community platform for Wecan Academy students and alumni."
    >

    <title>WeConnect | Member Login</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="login-header">
        <a href="index.html" aria-label="WeConnect home">
            <h1>WeConnect</h1>
        </a>
        <p>Wecan Academy Community</p>
    </header>

    <main class="login-container">

        <section class="login-box" aria-labelledby="login-heading">

            <h2 id="login-heading">Welcome Back!</h2>

            <p class="subtitle">
                Sign in to connect with your community.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="show-password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <div class="form-options">

                    <label class="remember-me">
                        <input
                            type="checkbox"
                            name="remember"
                        >
                        Remember me
                    </label>

                    <a href="forgot-password.html">
                        Forgot password?
                    </a>

                </div>

                <p
                    id="message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button type="submit" class="login-button">
                    Log In
                </button>

            </form>

            <p class="register-link">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

        </section>

    </main>

    <footer class="login-footer">
        <p>
            &copy; 2026 WeConnect. Wecan Academy Community.
        </p>
    </footer>

</body>
</html>
